[package]
name = "pwakun"
version = "0.2.0"
edition = "2021"
description = "Pengatur akun Windows: password, enable/disable, hapus akun, pulihkan admin bawaan (ringan, native Win32)"

[dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_NetManagement",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
